<!doctype html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="theme-color" content="#f5f2e9">
  <title>{{ page.title | default: site.title | escape }} — Ustin Vaskin</title>
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=DM+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}?v=2">
  <link id="hljs-theme-light" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github.min.css">
  <link id="hljs-theme-dark" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github-dark.min.css" disabled>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="topbar gutter">
    <a class="monogram" href="https://ustinvaskin.github.io/Ustin.Vaskin/" aria-label="Ustin Vaskin, portfolio">UV<span>.</span></a>
    <nav aria-label="Main navigation">
      <a href="https://ustinvaskin.github.io/Ustin.Vaskin/#work">Work</a>
      <a href="https://ustinvaskin.github.io/Ustin.Vaskin/#showroom">Showroom</a>
      <a href="https://ustinvaskin.github.io/Ustin.Vaskin/#about">About</a>
      <a href="{{ '/' | relative_url }}" aria-current="page">Writing</a>
    </nav>
    <a class="pill contact" href="https://ustinvaskin.github.io/Ustin.Vaskin/#contact">Contact</a>
  </header>
  <main id="main">{{ content }}</main>
  <footer class="footer gutter">
    <a class="monogram" href="https://ustinvaskin.github.io/Ustin.Vaskin/" aria-label="Ustin Vaskin, portfolio">UV<span>.</span></a>
    <span>© {{ site.time | date: "%Y" }} Ustin Vaskin · Oslo</span>
    <div><a href="https://www.linkedin.com/in/ustinvaskin/">LinkedIn</a><a href="https://github.com/ustinvaskin">GitHub</a><a href="#top">Back to top ↑</a></div>
  </footer>
  <script src="{{ '/assets/main.js' | relative_url }}?v=2" defer></script>
</body>
</html>
